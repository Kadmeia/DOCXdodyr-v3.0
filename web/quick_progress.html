<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCXдодыр — Фоновая обработка</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #0f172a;
            --border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-gradient: linear-gradient(90deg, #2563eb, #38bdf8);
            --success: #10b981;
            --success-gradient: linear-gradient(90deg, #059669, #10b981);
            --error: #ef4444;
            --accent-glow: rgba(59, 130, 246, 0.15);
        }

        @media (prefers-color-scheme: light) {
            :root:not(.dark) {
                --bg: #f8fafc;
                --card-bg: #ffffff;
                --border: #e2e8f0;
                --text-main: #0f172a;
                --text-muted: #64748b;
                --primary: #2563eb;
                --primary-gradient: linear-gradient(90deg, #2563eb, #60a5fa);
                --success: #059669;
                --success-gradient: linear-gradient(90deg, #059669, #34d399);
                --error: #dc2626;
                --accent-glow: rgba(37, 99, 235, 0.08);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 12px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 24px;
            box-shadow: 0 12px 32px var(--accent-glow);
            transition: all 0.25s ease;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-box {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            flex-shrink: 0;
        }

        .icon-box.success {
            background: rgba(16, 185, 129, 0.12);
            border-color: rgba(16, 185, 129, 0.3);
            color: var(--success);
        }

        .icon-box.error {
            background: rgba(239, 68, 68, 0.12);
            border-color: rgba(239, 68, 68, 0.3);
            color: var(--error);
        }

        .brand-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(59, 130, 246, 0.12);
            color: var(--primary);
            border: 1px solid rgba(59, 130, 246, 0.25);
            white-space: nowrap;
        }

        .badge.restore {
            background: rgba(16, 185, 129, 0.12);
            color: var(--success);
            border-color: rgba(16, 185, 129, 0.25);
        }

        /* Body info */
        .content {
            margin: 10px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-row {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }

        .status-text {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 82%;
        }

        .percent-text {
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
        }

        .percent-text.success {
            color: var(--success);
        }

        /* Progress Bar */
        .progress-track {
            width: 100%;
            height: 7px;
            background: var(--border);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary-gradient);
            border-radius: 999px;
            transition: width 0.25s ease-out, background 0.3s ease;
        }

        .progress-fill.success {
            background: var(--success-gradient);
        }

        .detail-text {
            font-size: 11.5px;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Footer */
        .footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .subnote {
            font-size: 11px;
            color: var(--text-muted);
        }

        .btn {
            font-size: 12px;
            font-weight: 500;
            padding: 5px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
            background: transparent;
        }

        .btn-cancel {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.25);
            background: rgba(239, 68, 68, 0.06);
        }

        .btn-cancel:hover {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .btn-action {
            color: #ffffff;
            background: var(--primary);
            border-color: var(--primary);
        }

        .btn-action:hover {
            background: #2563eb;
        }

        /* Spinner animation */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Top header -->
        <div class="header">
            <div class="brand">
                <div id="status-icon" class="icon-box">
                    <svg id="svg-gear" class="spinner" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="9" stroke-opacity="0.25"></circle>
                        <path d="M12 3a9 9 0 0 1 9 9" stroke-linecap="round"></path>
                    </svg>
                    <svg id="svg-check" class="hidden" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <svg id="svg-error" class="hidden" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                </div>
                <span class="brand-title">DOCXдодыр</span>
            </div>
            <span id="badge-mode" class="badge">Фоновая обработка</span>
        </div>

        <!-- Progress info -->
        <div class="content">
            <div class="status-row">
                <div id="status-text" class="status-text">Инициализация...</div>
                <div id="percent-text" class="percent-text">0%</div>
            </div>

            <div class="progress-track">
                <div id="progress-fill" class="progress-fill"></div>
            </div>

            <div id="detail-text" class="detail-text">Пожалуйста, подождите, идет обработка...</div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div id="subnote" class="subnote">Программа работает в фоновом режиме</div>
            <div id="action-buttons" style="display: flex; gap: 8px;">
                <button id="btn-pick-decoder" type="button" onclick="pickDecoder()" class="btn btn-action hidden">Выбрать дешифратор</button>
                <button id="btn-cancel" type="button" onclick="cancelOp()" class="btn btn-cancel">Отмена</button>
                <button id="btn-close" type="button" onclick="closeOp()" class="btn btn-cancel hidden">Закрыть</button>
            </div>
        </div>
    </div>

    <script>
        let isComplete = false;

        window.setGlobalProgress = function(visible, title, text, percent) {
            if (!visible && !isComplete) return;

            if (title) {
                const badge = document.getElementById('badge-mode');
                if (title.includes('Восстановление')) {
                    badge.textContent = 'Восстановление';
                    badge.classList.add('restore');
                } else if (title.includes('Обезличивание')) {
                    badge.textContent = 'Обезличивание';
                    badge.classList.remove('restore');
                }
            }

            if (text) {
                const statusEl = document.getElementById('status-text');
                const detailEl = document.getElementById('detail-text');
                
                if (text.startsWith('Файл:') || text.startsWith('Папка:') || text.startsWith('Обработка:')) {
                    statusEl.textContent = text;
                } else if (text.startsWith('Готово!') || text.startsWith('Завершено!')) {
                    statusEl.textContent = text;
                    detailEl.textContent = 'Папка с результатом обработки подготовлена';
                } else {
                    detailEl.textContent = text;
                }
            }

            if (percent !== undefined && percent !== null) {
                const p = Math.min(100, Math.max(0, parseInt(percent, 10) || 0));
                const fill = document.getElementById('progress-fill');
                const pct = document.getElementById('percent-text');
                fill.style.width = p + '%';
                pct.textContent = p + '%';

                if (p >= 100) {
                    onSuccessState();
                }
            }
        };

        window.showAlert = function(message) {
            const detailEl = document.getElementById('detail-text');
            const statusEl = document.getElementById('status-text');
            if (message && message.toLowerCase().includes('ошиб')) {
                onErrorState(message);
            } else {
                if (statusEl) statusEl.textContent = message;
            }
        };

        window.showMissingDecoder = function(message) {
            const statusEl = document.getElementById('status-text');
            const detailEl = document.getElementById('detail-text');
            const btnPick = document.getElementById('btn-pick-decoder');
            const btnCancel = document.getElementById('btn-cancel');
            const btnClose = document.getElementById('btn-close');
            const iconBox = document.getElementById('status-icon');
            const svgGear = document.getElementById('svg-gear');
            const svgErr = document.getElementById('svg-error');

            if (statusEl) statusEl.textContent = 'Дешифратор не найден';
            if (detailEl) detailEl.textContent = message || 'Файл дешифратора (.json) не найден рядом с документом';

            if (svgGear) svgGear.classList.add('hidden');
            if (svgErr) svgErr.classList.remove('hidden');
            if (iconBox) {
                iconBox.classList.remove('success');
                iconBox.classList.add('error');
            }

            if (btnPick) btnPick.classList.remove('hidden');
            if (btnCancel) btnCancel.classList.add('hidden');
            if (btnClose) btnClose.classList.remove('hidden');
        };

        function onSuccessState() {
            isComplete = true;
            const fill = document.getElementById('progress-fill');
            const pct = document.getElementById('percent-text');
            const subnote = document.getElementById('subnote');
            const btnCancel = document.getElementById('btn-cancel');
            const iconBox = document.getElementById('status-icon');
            const svgGear = document.getElementById('svg-gear');
            const svgCheck = document.getElementById('svg-check');

            fill.classList.add('success');
            pct.classList.add('success');
            if (svgGear) svgGear.classList.add('hidden');
            if (svgCheck) svgCheck.classList.remove('hidden');
            if (iconBox) iconBox.classList.add('success');

            if (subnote) subnote.textContent = 'Окно закроется автоматически...';
            if (btnCancel) btnCancel.classList.add('hidden');
        }

        function onErrorState(errMsg) {
            const statusEl = document.getElementById('status-text');
            const detailEl = document.getElementById('detail-text');
            const btnCancel = document.getElementById('btn-cancel');
            const btnClose = document.getElementById('btn-close');
            const iconBox = document.getElementById('status-icon');
            const svgGear = document.getElementById('svg-gear');
            const svgErr = document.getElementById('svg-error');

            if (statusEl) statusEl.textContent = 'Ошибка обработки';
            if (detailEl) detailEl.textContent = errMsg;
            if (svgGear) svgGear.classList.add('hidden');
            if (svgErr) svgErr.classList.remove('hidden');
            if (iconBox) iconBox.classList.add('error');

            if (btnCancel) btnCancel.classList.add('hidden');
            if (btnClose) btnClose.classList.remove('hidden');
        }

        function cancelOp() {
            const statusEl = document.getElementById('status-text');
            const btnCancel = document.getElementById('btn-cancel');
            if (statusEl) statusEl.textContent = 'Отмена операции...';
            if (btnCancel) btnCancel.disabled = true;

            if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.cancel_operation === 'function') {
                window.pywebview.api.cancel_operation();
            }
        }

        function pickDecoder() {
            if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.pick_decoder_for_quick_restore === 'function') {
                window.pywebview.api.pick_decoder_for_quick_restore();
            }
        }

        function closeOp() {
            if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.close_window === 'function') {
                window.pywebview.api.close_window();
            } else {
                window.close();
            }
        }

        window.addEventListener('pywebviewready', function() {
            if (window.pywebview && window.pywebview.api && typeof window.pywebview.api.init_ui === 'function') {
                window.pywebview.api.init_ui();
            }
        });
    </script>
</body>
</html>
